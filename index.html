<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>주술회전 일본어노트</title>
<meta name="theme-color" content="#0d0b1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0b1a; --bg2:#15122a; --card:#1c1835; --card2:#241f44; --line:#342d5e;
  --ink:#ece9ff; --ink2:#a9a3d1; --ink3:#6f6a96;
  --blue:#5aa9ff; --violet:#8b6cff; --red:#ff4d6d; --gold:#ffd166; --mint:#4fe3b5;
  --glow:0 0 24px rgba(139,108,255,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.6}
body{background:radial-gradient(1200px 600px at 80% -10%,#2a1f5c 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#3a1030 0%,transparent 55%),var(--bg);background-attachment:fixed;min-height:100vh}
.ja{font-family:"Noto Sans JP","Noto Sans KR",sans-serif}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 96px}
header.top{display:flex;align-items:center;gap:10px;margin:4px 0 18px}
header.top h1{font-family:"Dela Gothic One","Noto Sans KR",sans-serif;font-weight:400;font-size:22px;margin:0;letter-spacing:.5px}
header.top h1 small{display:block;font-family:"Noto Sans KR";font-size:12px;color:var(--ink2);letter-spacing:0}
.back{display:flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:12px;width:40px;height:40px;font-size:18px;flex:none}
.spacer{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;height:40px;padding:0 12px;font-size:14px}

/* 카드 */
.card{background:linear-gradient(180deg,var(--card) 0%,var(--bg2) 100%);border:1px solid var(--line);border-radius:18px;padding:18px;margin:0 0 14px}
.card h2{font-size:15px;margin:0 0 12px;color:var(--ink2);font-weight:700;display:flex;align-items:center;gap:8px}
.card h2 .n{background:var(--violet);color:#fff;border-radius:8px;font-size:12px;padding:1px 8px}
.muted{color:var(--ink2)}
.small{font-size:13px}

/* 홈 히어로 */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:22px 20px;margin-bottom:14px;background:linear-gradient(135deg,#2b1c6b 0%,#14102e 55%,#3d0d26 100%);border:1px solid #4a3b8c;box-shadow:var(--glow)}
.hero::after{content:"呪";position:absolute;right:-10px;top:-30px;font-family:"Dela Gothic One";font-size:170px;color:rgba(255,255,255,.05);line-height:1}
.hero .rank{display:inline-flex;gap:6px;align-items:center;background:rgba(255,209,102,.12);color:var(--gold);border:1px solid rgba(255,209,102,.4);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700}
.hero .big{font-family:"Dela Gothic One","Noto Sans KR";font-size:34px;margin:10px 0 2px;line-height:1.15}
.hero .sub{color:var(--ink2);font-size:14px}
.bar{height:10px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin:14px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--violet),var(--red));border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:rgba(0,0,0,.25);border-radius:12px;padding:8px 10px;text-align:center}
.stat b{display:block;font-size:20px;font-family:"Dela Gothic One","Noto Sans KR";font-weight:400}
.stat span{font-size:11px;color:var(--ink2)}
.cta{display:block;width:100%;margin-top:16px;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:900;color:#fff;background:linear-gradient(90deg,#5a3fd6,#8b6cff);box-shadow:0 6px 20px rgba(90,63,214,.45);text-align:center;text-decoration:none}
.cta.alt{background:linear-gradient(90deg,#b8203f,#ff4d6d);box-shadow:0 6px 20px rgba(255,77,109,.35)}
.cta.ghost{background:var(--card2);box-shadow:none;border:1px solid var(--line);font-weight:700;font-size:15px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* 365 그리드 */
.phase{margin:14px 0 6px;font-size:13px;color:var(--ink2);display:flex;justify-content:space-between}
.phase b{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.cell{aspect-ratio:1;border-radius:5px;background:#1b1736;border:1px solid #251f48;font-size:9px;display:flex;align-items:center;justify-content:center;color:var(--ink3);text-decoration:none;position:relative}
.cell.open{background:#2a2456;color:var(--ink2);border-color:#3b3375}
.cell.rev{background:#1f3a44;border-color:#2b5866;color:#8fd6e8}
.cell.done{background:linear-gradient(135deg,var(--violet),var(--blue));color:#fff;border-color:transparent}
.cell.rev.done{background:linear-gradient(135deg,#1aa58a,var(--mint))}
.cell.next{outline:2px solid var(--gold);outline-offset:1px;color:var(--gold)}
.cell.today::after{content:"";position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--red)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--ink2);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}

/* 데이 화면 */
.daytag{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--ink2)}
.chip.ep{color:var(--blue);border-color:#2f4f86}
.chip.gr{color:var(--gold);border-color:#6b5520}
.dtitle{font-family:"Dela Gothic One","Noto Sans KR";font-weight:400;font-size:24px;line-height:1.3;margin:4px 0 6px}
.scene{background:linear-gradient(135deg,#221b4a,#1a1430);border-left:4px solid var(--violet);border-radius:12px;padding:12px 14px;font-size:15px}
.watch{margin-top:8px;font-size:13px;color:var(--blue)}
.toggles{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.tg{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--ink2)}
.tg.on{background:#3b2f86;color:#fff;border-color:#5a4bc0}

.line{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px dashed var(--line)}
.line:first-of-type{border-top:0}
.who{flex:none;width:58px;font-size:12px;color:var(--ink2);padding-top:4px;text-align:center}
.who .av{display:flex;width:40px;height:40px;margin:0 auto 2px;border-radius:50%;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#fff;background:var(--violet)}
.body{flex:1;min-width:0}
.jp{font-size:20px;font-weight:700;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere}
.kana{font-size:13px;color:var(--mint);margin-top:2px}
.ko{font-size:14px;color:var(--ink2);margin-top:2px}
.hideKana .kana,.hideKo .ko.hid{visibility:hidden}
.hideKo .ko.hid{visibility:hidden}
.ko.hid{cursor:pointer}
.say{flex:none;border:0;width:40px;height:40px;border-radius:50%;background:#2c2560;color:#fff;font-size:16px}
.say.playing{background:var(--violet);box-shadow:var(--glow)}
.shadow{display:flex;gap:4px;margin-top:6px}
.shadow button{border:1px solid var(--line);background:transparent;border-radius:8px;font-size:11px;padding:2px 8px;color:var(--ink3)}
.shadow button.on{background:#1aa58a;border-color:#1aa58a;color:#fff}

.words{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.word{position:relative;min-height:84px;perspective:600px;border:0;background:none;padding:0;text-align:center}
.word .in{position:relative;width:100%;height:100%;min-height:84px;transition:transform .45s;transform-style:preserve-3d}
.word.flip .in{transform:rotateY(180deg)}
.word .f,.word .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;border:1px solid var(--line)}
.word .f{background:var(--card2)}
.word .f b{font-size:22px;font-family:"Noto Sans JP"}
.word .f span{font-size:12px;color:var(--mint)}
.word .b{background:linear-gradient(135deg,#3b2f86,#5a1f4a);transform:rotateY(180deg);font-weight:700}
.word .b span{font-size:12px;color:var(--ink2);font-weight:400}

.gpoint{font-size:22px;font-weight:700;color:var(--gold);font-family:"Noto Sans JP";margin-bottom:6px}
.gdesc{font-size:15px;white-space:pre-line}
.ex{margin-top:10px;background:rgba(0,0,0,.2);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.ex .jp{font-size:17px}

.conv{display:grid;gap:8px}
.conv .box{border-radius:12px;padding:10px 12px}
.conv .anime{background:rgba(255,77,109,.1);border:1px solid rgba(255,77,109,.35)}
.conv .real{background:rgba(79,227,181,.08);border:1px solid rgba(79,227,181,.35)}
.conv .lab{font-size:11px;font-weight:700;letter-spacing:.5px}
.conv .anime .lab{color:var(--red)} .conv .real .lab{color:var(--mint)}
.conv .arrow{text-align:center;color:var(--ink3);font-size:18px;line-height:1}

.mission{font-size:15px;white-space:pre-line}
.rec{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.rec button{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:8px 14px;font-size:14px}
.rec button.recording{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.reveal{margin-top:10px}
.reveal summary{cursor:pointer;color:var(--blue);font-size:14px}

.q{padding:12px 0;border-top:1px dashed var(--line)}
.q:first-child{border-top:0}
.q .qq{font-weight:700;margin-bottom:8px}
.opts{display:grid;gap:6px}
.opt{text-align:left;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 12px;font-size:16px}
.opt.ok{background:rgba(79,227,181,.18);border-color:var(--mint)}
.opt.ng{background:rgba(255,77,109,.15);border-color:var(--red)}
.why{font-size:13px;color:var(--ink2);margin-top:6px}

.finish{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(13,11,26,.95) 30%);z-index:5}
.finish .cta{max-width:688px;margin:0 auto}
.cta[disabled]{opacity:.45;filter:grayscale(.6)}

/* 복습 카드 */
.flash{min-height:230px;border-radius:20px;background:linear-gradient(135deg,#2b1c6b,#14102e);border:1px solid #4a3b8c;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;cursor:pointer;box-shadow:var(--glow)}
.flash .w{font-size:40px;font-weight:700;font-family:"Noto Sans JP"}
.flash .r{color:var(--mint);font-size:16px;margin-top:4px}
.flash .m{font-size:20px;font-weight:700;margin-top:10px}
.flash .hint{color:var(--ink3);font-size:12px;margin-top:14px}

.toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:#2b1c6b;border:1px solid var(--gold);color:var(--gold);padding:10px 18px;border-radius:14px;font-weight:700;z-index:20;box-shadow:var(--glow);max-width:90vw;text-align:center}
.notice{font-size:13px;background:rgba(255,209,102,.08);border:1px solid rgba(255,209,102,.3);color:#f3d58a;border-radius:12px;padding:10px 12px;margin-bottom:12px}
.foot{font-size:11px;color:var(--ink3);text-align:center;margin-top:20px;line-height:1.7}
.eplist{display:grid;gap:8px}
.eprow{display:flex;justify-content:space-between;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;text-decoration:none}
.eprow .t{font-family:"Noto Sans JP"}
.eprow.lock{opacity:.45}

/* 인쇄 */
#print{display:none}
@media print{
  @page{size:A4;margin:12mm 12mm 14mm}
  body{background:#fff!important;color:#111}
  #app,.finish,.toast{display:none!important}
  #print{display:block;font-family:"Noto Sans KR",sans-serif;color:#111;font-size:10.5pt;line-height:1.5}
}
.pcover{height:250mm;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;page-break-after:always}
.pcover h1{font-family:"Dela Gothic One","Noto Sans KR";font-weight:400;font-size:34pt;margin:0}
.pcover .kan{font-family:"Dela Gothic One";font-size:90pt;color:#5a3fd6;line-height:1}
.pday{border:1.5px solid #222;border-radius:10px;padding:8mm 8mm 6mm;margin-bottom:6mm;page-break-inside:avoid;break-inside:avoid}
.pday.pb{page-break-before:always}
.ph{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #5a3fd6;padding-bottom:2mm;margin-bottom:3mm}
.ph b{font-size:14pt}
.ph span{font-size:9pt;color:#555}
.pjp{font-family:"Noto Sans JP";font-size:13pt;font-weight:700}
.pkana{font-size:9pt;color:#1a7f63}
.pko{font-size:9pt;color:#555}
.pl{margin:0 0 2.5mm}
.pwords{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5mm;margin:2mm 0}
.pwords div{border:1px solid #bbb;border-radius:5px;padding:1mm 2mm;font-size:9pt}
.pwords b{font-family:"Noto Sans JP";font-size:11pt}
.pg{background:#f4f1ff;border-radius:6px;padding:2mm 3mm;margin:2mm 0;font-size:9.5pt}
.pg .pt{font-family:"Noto Sans JP";font-weight:700;color:#4a2fc0}
.pwrite{border-bottom:1px solid #999;height:8mm}
.pq{font-size:9.5pt;margin:1mm 0}
.pchk{font-size:9pt;color:#333;margin-top:2mm}
.pans{font-size:9pt;columns:2}
</style>
</head>

<script>
/* ================= 기본 설정 ================= */
const START = '2026-10-13';            // Day 1 날짜
const TOTAL = 365;
const DAYS = window.JJ_DAYS || {};
const RANKS = [[0,'4급 주술사'],[30,'3급 주술사'],[60,'준2급 주술사'],[100,'2급 주술사'],[150,'준1급 주술사'],[220,'1급 주술사'],[365,'특급 주술사']];
const PHASES = [
  [1,144,'1기','이타도리 입학 ~ 교류회·기수뇌동 (1~24화)','N5 → N4'],
  [145,152,'극장판','주술회전 0','N4'],
  [153,262,'2기','회옥·옥절 + 시부야사변 (25~47화)','N4 → N3'],
  [263,330,'3기','사멸회유 전편 (48~59화)','N3'],
  [331,365,'총정리','실전 회화 34일 + 졸업 인터뷰','N4~N3 완성']
];
// [회차id, 일본어 제목, 한국어 제목, 시즌]  ('0' = 극장판, 'F' = 총정리)
const EPISODES = [["1","両面宿儺","료멘스쿠나","1기"],["2","自分のために","자신을 위해","1기"],["3","鉄骨娘","철골 소녀","1기"],["4","呪胎戴天","주태대천","1기"],["5","呪胎戴天－弐－","주태대천 2","1기"],["6","雨後","비 온 뒤","1기"],["7","急襲","급습","1기"],["8","退屈","지루함","1기"],["9","幼魚と逆罰","어린 물고기와 역벌","1기"],["10","無為転変","무위전변","1기"],["11","固陋蠢愚","고루준우","1기"],["12","いつかの君へ","언젠가의 너에게","1기"],["13","また明日","내일 봐","1기"],["14","京都姉妹校交流会－団体戦(0)－","교토 자매학교 교류회 0","1기"],["15","京都姉妹校交流会－団体戦(1)－","교류회 단체전 1","1기"],["16","京都姉妹校交流会－団体戦(2)－","교류회 단체전 2","1기"],["17","京都姉妹校交流会－団体戦(3)－","교류회 단체전 3","1기"],["18","賢者","현자","1기"],["19","黒閃","흑섬","1기"],["20","規格外","규격 외","1기"],["21","呪術甲子園","주술 고시엔","1기"],["22","起首雷同","기수뇌동","1기"],["23","起首雷同－弐－","기수뇌동 2","1기"],["24","共犯","공범","1기"],["0","劇場版 呪術廻戦 0","극장판 주술회전 0","극장판"],["25","懐玉","회옥","2기"],["26","懐玉-弐-","회옥 2","2기"],["27","懐玉-参-","회옥 3","2기"],["28","懐玉-肆-","회옥 4","2기"],["29","玉折","옥절","2기"],["30","そういうこと","그런 거야","2기"],["31","宵祭り","전야제","2기"],["32","渋谷事変","시부야 사변","2기"],["33","渋谷事変 開門","시부야 사변 개문","2기"],["34","昏乱","혼란","2기"],["35","降霊","강령","2기"],["36","鈍刀","둔도","2기"],["37","赫鱗","혁린","2기"],["38","揺蕩","요탕","2기"],["39","揺蕩-弐-","요탕 2","2기"],["40","霹靂","벽력","2기"],["41","霹靂-弐-","벽력 2","2기"],["42","理非","이비","2기"],["43","理非-弐-","이비 2","2기"],["44","理非-参-","이비 3","2기"],["45","変身","변신","2기"],["46","変身-弐-","변신 2","2기"],["47","渋谷事変 閉門","시부야 사변 폐문","2기"],["48","執行","집행","3기"],["49","もう一度","한 번 더","3기"],["50","死滅回游について","사멸회유에 대해","3기"],["51","葦を啣む","갈대를 물다","3기"],["52","熱","열","3기"],["53","部品","부품","3기"],["54","東京第1結界①","도쿄 제1결계 1","3기"],["55","東京第1結界②","도쿄 제1결계 2","3기"],["56","東京第1結界③","도쿄 제1결계 3","3기"],["57","東京第1結界④","도쿄 제1결계 4","3기"],["58","東京第1結界⑤","도쿄 제1결계 5","3기"],["59","仙台結界","센다이 결계","3기"],["F","総まとめ","총정리 · 실전 회화","총정리"]];
const epLabel = ep => ep === '0' ? '극장판' : ep === 'F' ? '총정리' : ep + '화';
const isRev = d => d % 7 === 0 && d < 330;
const isTest = d => d % 30 === 0 && d < 331;

/* ================= 저장소 (실패해도 동작) ================= */
const store = {
  get(k, def){ try{ const v = localStorage.getItem('jjnote-'+k); return v == null ? def : JSON.parse(v); }catch(e){ return def; } },
  set(k, v){ try{ localStorage.setItem('jjnote-'+k, JSON.stringify(v)); }catch(e){} }
};
const opts = Object.assign({kana:true, ko:true, rate:0.9}, store.get('opts', {}));
const saveOpts = () => store.set('opts', opts);

/* ================= 날짜 ================= */
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function calendarDay(){
  const s = new Date(START+'T00:00:00'); const t = new Date(); t.setHours(0,0,0,0);
  return Math.max(1, Math.min(TOTAL, Math.floor((t - s)/86400000) + 1));
}
function dateOf(day){ const s = new Date(START+'T00:00:00'); s.setDate(s.getDate()+day-1); return (s.getMonth()+1)+'/'+s.getDate(); }

/* ================= 진도 ================= */
const done = () => store.get('done', {});
const isDone = d => !!done()[d];
function hasContent(d){
  if (d === TOTAL) return !!window.JJ_FINAL;
  return !!DAYS[d] || isRev(d) || isTest(d);
}
function nextDay(){ for (let d=1; d<=TOTAL; d++){ if (!isDone(d)) return d; } return TOTAL; }
function doneCount(){ return Object.keys(done()).length; }
function rankOf(n){ let r = RANKS[0][1]; RANKS.forEach(([k,name]) => { if (n >= k) r = name; }); return r; }
function nextRank(n){ for (const [k,name] of RANKS){ if (n < k) return [k,name]; } return null; }
function streak(){
  const dd = Object.values(done()); if (!dd.length) return 0;
  const set = new Set(dd); let s = 0; const t = new Date(); t.setHours(0,0,0,0);
  if (!set.has(ymd(t))) t.setDate(t.getDate()-1);
  while (set.has(ymd(t))) { s++; t.setDate(t.getDate()-1); }
  return s;
}
function markDone(d){
  const m = done(); const before = rankOf(Object.keys(m).length);
  if (!m[d]) m[d] = ymd(new Date());
  store.set('done', m);
  const after = rankOf(Object.keys(m).length);
  if (after !== before) toast('🎉 승급! ' + after);
}

/* ================= 간격 반복(SRS) ================= */
const GAPS = [1,2,4,8,16,32,64,128];
function allWords(){
  const out = {}; Object.values(DAYS).forEach(D => (D.words||[]).forEach(w => { out[w.w] = Object.assign({day:D.day}, w); }));
  return out;
}
function srs(){ return store.get('srs', {}); }
function addWords(day){
  const s = srs(); const t = new Date(); t.setDate(t.getDate()+1); const tomorrow = ymd(t);
  (DAYS[day] && DAYS[day].words || []).forEach(w => { if (!s[w.w]) s[w.w] = {box:0, due:tomorrow}; });
  store.set('srs', s);
}
function dueWords(){
  const s = srs(); const t = ymd(new Date()); const W = allWords();
  return Object.keys(s).filter(k => s[k].due <= t && W[k]).map(k => W[k]);
}
function grade(w, ok){
  const s = srs(); const c = s[w] || {box:0};
  c.box = ok ? Math.min(c.box+1, GAPS.length-1) : 0;
  const d = new Date(); d.setDate(d.getDate() + (ok ? GAPS[c.box] : 1));
  c.due = ymd(d); s[w] = c; store.set('srs', s);
}

/* ================= 음성 (브라우저 일본어 TTS) ================= */
let jaVoice = null;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang));
    jaVoice = vs.find(v => /google/i.test(v.name)) || vs.find(v => /nanami|keita|online|natural/i.test(v.name)) || vs[0] || null;
  }catch(e){}
}
try{ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }catch(e){}
function speak(text, btn, rate){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; if (jaVoice) u.voice = jaVoice; u.rate = rate || opts.rate;
    if (btn){ btn.classList.add('playing'); u.onend = u.onerror = () => btn.classList.remove('playing'); }
    speechSynthesis.speak(u);
    if (!jaVoice) setTimeout(() => { pickVoice(); if (!jaVoice) toast('일본어 음성이 없어요. 휴대폰 설정 › 텍스트 음성 변환에서 일본어 음성을 설치하세요.'); }, 600);
  }catch(e){ toast('이 화면에서는 음성이 나오지 않아요. Chrome에서 열어주세요.'); }
}

/* ================= 녹음 (IndexedDB) ================= */
function idb(){ return new Promise((res, rej) => { try{ const r = indexedDB.open('jjnote', 1); r.onupgradeneeded = () => r.result.createObjectStore('rec'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }catch(e){ rej(e); } }); }
async function recPut(k, blob){ try{ const db = await idb(); db.transaction('rec','readwrite').objectStore('rec').put(blob, k); }catch(e){} }
async function recGet(k){ try{ const db = await idb(); return await new Promise(r => { const q = db.transaction('rec').objectStore('rec').get(k); q.onsuccess = () => r(q.result || null); q.onerror = () => r(null); }); }catch(e){ return null; } }
let mediaRec = null;
async function toggleRec(key, btn){
  if (mediaRec && mediaRec.state === 'recording'){ mediaRec.stop(); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const chunks = []; mediaRec = new MediaRecorder(stream);
    mediaRec.ondataavailable = e => chunks.push(e.data);
    mediaRec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      await recPut(key, new Blob(chunks, {type: mediaRec.mimeType || 'audio/webm'}));
      btn.classList.remove('recording'); btn.textContent = '🎙 다시 녹음'; toast('녹음 저장됨');
    };
    mediaRec.start(); btn.classList.add('recording'); btn.textContent = '⏹ 녹음 끝내기';
  }catch(e){ toast('마이크를 쓸 수 없어요 (권한 허용 필요)'); }
}
async function playRec(key){
  const b = await recGet(key); if (!b){ toast('아직 녹음이 없어요'); return; }
  const a = new Audio(URL.createObjectURL(b)); a.play();
}

const $app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
const AV_COLORS = {'이타도리':'#ff6b8a','후시구로':'#4a6cff','고죠':'#5aa9ff','쿠기사키':'#ff9f43','스쿠나':'#d6283f','야가':'#8a7a5a','이지치':'#7a8a9a','할아버지':'#9a8a7a','게토':'#6b5bd6','나나미':'#c9a227','마키':'#2fa36b','판다':'#555','이누마키':'#7fb3d5','토도':'#b5651d','옷코츠':'#3d6fb6','리카':'#a64ca6','마히토':'#5e9c8f','죠고':'#e2603b','쵸소':'#8e2a3a','메이메이':'#c2b280','쥰페이':'#6d7fa3','하나미':'#4f8a3a','켄자쿠':'#7d3c98','텐겐':'#bfbfbf','히구루마':'#34495e','하카리':'#e67e22','나':'#1aa58a'};
function avatar(who){
  const c = AV_COLORS[who] || Object.entries(AV_COLORS).find(([k]) => String(who).includes(k))?.[1] || '#8b6cff';
  return '<span class="av" style="background:'+c+'">'+esc(String(who||'?').charAt(0))+'</span>';
}
function sayBtn(text){ return '<button class="say" data-say="'+esc(text)+'" aria-label="듣기">🔊</button>'; }
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
document.addEventListener('click', e => {
  const s = e.target.closest('[data-say]'); if (s){ speak(s.dataset.say, s.classList.contains('say') ? s : null); return; }
  const w = e.target.closest('.word'); if (w){ w.classList.toggle('flip'); if (w.classList.contains('flip')) speak(w.dataset.w); return; }
  const k = e.target.closest('.ko.hid'); if (k){ k.classList.remove('hid'); }
});

}

/* ================= 화면: 주간 복습일 ================= */
function rangeDays(a, b){ const r = []; for (let i=a; i<=b; i++) if (DAYS[i]) r.push(DAYS[i]); return r; }
function buildQuiz(ds, n){
  const words = []; ds.forEach(D => D.words.forEach(w => words.push(w)));
  const lines = []; ds.forEach(D => D.lines.concat(D.grammar.ex).forEach(l => lines.push(l)));
  const qs = [];
  shuffle(words).slice(0, Math.ceil(n*0.6)).forEach(w => {
    const wrong = shuffle(words.filter(x => x.ko !== w.ko)).slice(0,2).map(x => x.ko);
    const ch = shuffle([w.ko].concat(wrong));
    qs.push({type:'w', q:w.w, sub:w.r, say:w.w, choices:ch, a:ch.indexOf(w.ko)});
  });
  shuffle(lines).slice(0, Math.floor(n*0.4)).forEach(l => {
    const wrong = shuffle(lines.filter(x => x.ko !== l.ko)).slice(0,2).map(x => x.ko);
    const ch = shuffle([l.ko].concat(wrong));
    qs.push({type:'l', q:'🔊 듣고 뜻 고르기', say:l.ja, sub:l.ja, choices:ch, a:ch.indexOf(l.ko)});
  });
  return shuffle(qs);
}
function quizBlock(qs){
  return qs.map((Q,i) => '<div class="q" data-q="'+i+'"><div class="qq" style="display:flex;gap:10px;align-items:center"><span style="flex:1">Q'+(i+1)+'. <span class="ja" style="font-size:'+(Q.type==='w'?'22px':'16px')+'">'+esc(Q.q)+'</span>'
    +(Q.type==='w' && opts.kana && Q.sub!==Q.q ? ' <span class="kana ja">'+esc(Q.sub)+'</span>' : '')+'</span>'+sayBtn(Q.say)+'</div>'
    +'<div class="opts">'+Q.choices.map((c,j) => '<button class="opt" data-j="'+j+'">'+esc(c)+'</button>').join('')+'</div>'
    +(Q.type==='l' ? '<div class="why" hidden>'+esc(Q.sub)+'</div>' : '')+'</div>').join('');
}
function wireQuiz(qs, onAll){
  let score = 0; const st = {};
  $app.querySelectorAll('.q').forEach(qe => {
    const i = +qe.dataset.q, Q = qs[i];
    qe.querySelectorAll('.opt').forEach(o => o.onclick = () => {
      if (st[i] !== undefined) return;
      const ok = +o.dataset.j === Q.a; st[i] = ok; if (ok) score++;
      o.classList.add(ok ? 'ok' : 'ng'); if (!ok) qe.querySelectorAll('.opt')[Q.a].classList.add('ok');
      const w = qe.querySelector('.why'); if (w) w.hidden = false;
      if (Q.type === 'w') grade(Q.q, ok);
      if (Object.keys(st).length === qs.length) onAll(score);
    });
  });
}
function viewRevDay(d){
  const ds = rangeDays(d-6, d-1); const qs = buildQuiz(ds, 10);
  let h = '<header class="top"><a class="back" href="#">‹</a><div class="spacer"></div>'+(DAYS[d+1]||hasContent(d+1) ? '<a class="iconbtn" href="#day/'+(d+1)+'" style="text-decoration:none;line-height:40px">다음 ›</a>' : '')+'</header>';
  h += '<div class="daytag"><span class="chip">Day '+d+' · '+dateOf(d)+'</span><span class="chip ep">주간 복습</span></div><div class="dtitle">이번 주 정리 · 10문제</div>';
  h += '<section class="card"><h2>📌 이번 주 문법</h2>'+ds.map(D => '<div class="ex"><div class="body"><div class="small muted">Day '+D.day+'</div><div class="jp ja" style="font-size:17px;color:var(--gold)">'+esc(D.grammar.point)+'</div><div class="ja">'+esc(D.grammar.ex[0].ja)+'</div><div class="ko">'+esc(D.grammar.ex[0].ko)+'</div></div>'+sayBtn(D.grammar.ex[0].ja)+'</div>').join('')+'</section>';
  h += '<section class="card"><h2>📝 복습 퀴즈</h2>'+quizBlock(qs)+'</section>';
  h += '<section class="card"><h2>🎙 이번 주 대사 몰아서 섀도잉</h2>'+ds.map(D => D.lines.map(L => '<div class="ex"><div class="body"><div class="jp ja" style="font-size:16px">'+esc(L.ja)+'</div><div class="ko">'+esc(L.ko)+'</div></div>'+sayBtn(L.ja)+'</div>').join('')).join('')+'</section>';
  h += '<div class="finish"><button class="cta" id="fin" '+(isDone(d)?'':'disabled')+'>'+(isDone(d)?'✓ 완료한 날 · 홈으로':'퀴즈를 다 풀면 완료할 수 있어요')+'</button></div>';
  $app.innerHTML = h; scrollTo(0,0);
  const fin = document.getElementById('fin');
  wireQuiz(qs, s => { fin.disabled = false; fin.textContent = '🔥 '+s+'/'+qs.length+'점 · Day '+d+' 완료하기'; });
  fin.onclick = () => { if (!isDone(d)) markDone(d); location.hash = ''; };
}

/* ================= 화면: 월말 테스트 ================= */
function viewTest(d){
  const ds = rangeDays(d-29, d-1); const qs = buildQuiz(ds, 20);
  const speak10 = shuffle(ds.map(D => D.lines.concat(D.grammar.ex)).flat()).slice(0,10);
  let h = '<header class="top"><a class="back" href="#">‹</a></header>';
  h += '<div class="daytag"><span class="chip">Day '+d+' · '+dateOf(d)+'</span><span class="chip gr">월말 테스트</span></div><div class="dtitle">'+(d/30)+'개월차 승급 시험</div>';
  h += '<section class="card"><h2>① 듣기·어휘 20문제</h2>'+quizBlock(qs)+'</section>';
  h += '<section class="card"><h2>② 말하기 10문장 · 한국어를 보고 일본어로 말하기</h2>'+speak10.map((L,i) => '<div class="q"><div class="qq">'+(i+1)+'. '+esc(L.ko)+'</div><details class="reveal"><summary>정답 보기</summary><div class="ex"><div class="body"><div class="jp ja" style="font-size:17px">'+esc(L.ja)+'</div><div class="kana ja">'+esc(L.kana)+'</div></div>'+sayBtn(L.ja)+'</div></details></div>').join('')+'</section>';
  h += '<section class="card"><h2>③ 한 달 전의 나와 비교 🎙</h2><div class="mission">Day 1에 녹음한 자기소개를 들어보고, 지금 다시 자기소개를 녹음해 보세요. 이름 · 직업 · 좋아하는 것 · 하고 싶은 것까지 넣어서요.</div><div class="rec"><button id="p1">⏮ Day 1 녹음</button><button id="recBtn">🎙 지금 녹음</button><button id="playBtn">▶ 지금 녹음 듣기</button></div></section>';
  h += '<div class="finish"><button class="cta" id="fin" '+(isDone(d)?'':'disabled')+'>'+(isDone(d)?'✓ 통과 · 홈으로':'20문제를 다 풀면 완료')+'</button></div>';
  $app.innerHTML = h; scrollTo(0,0);
  document.getElementById('p1').onclick = () => playRec('day1');
  const rb = document.getElementById('recBtn'); rb.onclick = () => toggleRec('test'+d, rb);
  document.getElementById('playBtn').onclick = () => playRec('test'+d);
  const fin = document.getElementById('fin');
  wireQuiz(qs, s => { fin.disabled = false; fin.textContent = (s >= 16 ? '🏆 ' : '💪 ')+s+'/20점 · 완료하기'+(s < 16 ? ' (16점 미만이면 단어 복습 추천)' : ''); });
  fin.onclick = () => { if (!isDone(d)) markDone(d); location.hash = ''; };
}

/* ================= 화면: Day 365 졸업 인터뷰 ================= */
function viewFinal(){
  const F = window.JJ_FINAL; const d = TOTAL; const chk = store.get('final-chk', {});
  let h = '<header class="top"><a class="back" href="#">‹</a></header>';
  h += '<div class="daytag"><span class="chip">Day 365 · '+dateOf(d)+'</span><span class="chip gr">졸업 시험</span></div><div class="dtitle">'+esc(F.title)+'</div>';
  h += '<section class="card"><div class="mission">'+esc(F.intro)+'</div><div class="rec"><button id="recBtn">🎙 인터뷰 전체 녹음</button><button id="playBtn">▶ 오늘 녹음</button><button id="p1">⏮ Day 1 녹음</button></div></section>';
  F.qs.forEach((Q,i) => {
    h += '<section class="card"><h2><span class="n">'+(i+1)+'</span> 질문 듣기 '+sayBtn(Q.q)+'</h2>'
       + '<details class="reveal"><summary>질문 글자 보기</summary><div class="jp ja" style="font-size:17px">'+esc(Q.q)+'</div><div class="kana ja">'+esc(Q.qk)+'</div><div class="ko">'+esc(Q.ko)+'</div></details>'
       + '<details class="reveal"><summary>모범답 보기</summary><div class="ex"><div class="body"><div class="jp ja" style="font-size:16px">'+esc(Q.a)+'</div><div class="ko">'+esc(Q.ak)+'</div></div>'+sayBtn(Q.a)+'</div></details>'
       + '<div class="shadow" style="margin-top:10px"><button data-fc="'+i+'" class="'+(chk[i]?'on':'')+'">✓ 일본어로 대답했다</button></div></section>';
  });
  h += '<div id="cert"></div>';
  h += '<div class="finish"><button class="cta" id="fin">'+(isDone(d) ? '🏅 특급 주술사 승급증 보기' : '20문제 대답하고 졸업하기')+'</button></div>';
  $app.innerHTML = h; scrollTo(0,0);
  const rb = document.getElementById('recBtn'); rb.onclick = () => toggleRec('final', rb);
  document.getElementById('playBtn').onclick = () => playRec('final');
  document.getElementById('p1').onclick = () => playRec('day1');
  $app.querySelectorAll('[data-fc]').forEach(b => b.onclick = () => { const c = store.get('final-chk', {}); c[b.dataset.fc] = !c[b.dataset.fc]; store.set('final-chk', c); b.classList.toggle('on'); });
  document.getElementById('fin').onclick = () => {
    const n = Object.values(store.get('final-chk', {})).filter(Boolean).length;
    if (!isDone(d) && n < 15){ toast('15문제 이상 대답해야 졸업할 수 있어요 (지금 '+n+'개)'); return; }
    if (!isDone(d)) markDone(d);
    document.getElementById('cert').innerHTML = '<section class="hero" style="text-align:center"><span class="rank">⚡ 特級呪術師</span><div class="big">특급 주술사 승급</div><div class="sub">365일 일본어 수행을 마쳤습니다</div>'
      + '<div class="stats"><div class="stat"><b>'+doneCount()+'</b><span>완료한 날</span></div><div class="stat"><b>'+Object.keys(srs()).length+'</b><span>배운 단어</span></div><div class="stat"><b>'+n+'/20</b><span>인터뷰</span></div></div>'
      + '<p class="sub" style="margin-top:14px">'+dateOf(1)+' 시작 → '+dateOf(TOTAL)+' 졸업<br>お疲れさまでした。ここからが本番です。</p></section>';
    document.getElementById('cert').scrollIntoView({behavior:'smooth'});
  };
}

/* ================= 화면: 단어 복습 (SRS) ================= */
function viewReview(){
  const list = shuffle(dueWords()); let i = 0, ok = 0, back = false;
  function draw(){
    if (i >= list.length){
      $app.innerHTML = '<header class="top"><a class="back" href="#">‹</a><h1>단어 복습</h1></header><section class="card" style="text-align:center"><div class="dtitle">'+(list.length ? '오늘 복습 끝! '+ok+'/'+list.length : '오늘 복습할 단어가 없어요')+'</div><p class="muted">맞힌 단어는 점점 더 긴 간격(1→2→4→8…일)으로, 틀린 단어는 내일 다시 나와요.</p><a class="cta" href="#">홈으로</a></section>';
      return;
    }
    const w = list[i];
    $app.innerHTML = '<header class="top"><a class="back" href="#">‹</a><h1>단어 복습<small>'+(i+1)+' / '+list.length+'</small></h1></header>'
      + '<div class="flash" id="fl"><div class="w">'+esc(w.w)+'</div>'+(back ? '<div class="r">'+esc(w.r)+'</div><div class="m">'+esc(w.ko)+'</div><div class="hint">Day '+w.day+'</div>' : '<div class="hint">뜻을 떠올린 뒤 눌러서 확인</div>')+'</div>'
      + (back ? '<div class="row2" style="margin-top:14px"><button class="cta alt" id="ng" style="margin:0">✗ 몰랐다</button><button class="cta" id="ok" style="margin:0">○ 알았다</button></div>' : '');
    document.getElementById('fl').onclick = () => { if (!back){ back = true; speak(w.w); draw(); } else speak(w.w); };
    if (back){
      document.getElementById('ok').onclick = () => { grade(w.w, true); ok++; i++; back = false; draw(); };
      document.getElementById('ng').onclick = () => { grade(w.w, false); i++; back = false; draw(); };
    }
  }
  draw();
}

/* ================= 화면: 단어장 ================= */

  const s = srs(); const W = Object.values(allWords()).filter(w => s[w.w]);

  else h += '<section class="card">'+W.map(w => '<div class="ex" data-say="'+esc(w.w)+'" style="cursor:pointer"><div class="body"><span class="jp ja" style="font-size:18px">'+esc(w.w)+'</span> <span class="kana ja">'+esc(w.r)+'</span><div class="ko">'+esc(w.ko)+'</div></div><span class="chip">'+(s[w.w].box >= 4 ? '🟢 암기' : s[w.w].box >= 2 ? '🟡 익숙' : '🔴 학습중')+'</span></div>').join('')+'</section>';
  $app.innerHTML = h;
}

/* ================= 인쇄용 (월별 워크북) ================= */
function viewPrint(m){
  const a = (m-1)*30+1, b = Math.min(m*30, TOTAL);
  let h = '<div class="pcover"><div class="kan">呪</div><h1>주술회전 일본어노트</h1><p style="font-size:14pt;margin:6mm 0 2mm">'+m+'개월차 워크북 · Day '+a+' ~ '+b+'</p><p style="color:#555">'+dateOf(a)+' ~ '+dateOf(b)+' · '+[...new Set(rangeDays(a,b).map(D => epLabel(D.ep)))].join(' · ')+'</p>'
        + '<p style="margin-top:20mm;font-size:10pt;color:#666">대사는 학습용으로 새로 쓴 문장입니다. 앱에서 음성을 들으며 함께 공부하세요.</p></div>';
  const revAns = [];
  for (let d=a; d<=b; d++){
    const D = DAYS[d];
    if (d === TOTAL && window.JJ_FINAL){
      const F = window.JJ_FINAL;
      h += '<div class="pday pb"><div class="ph"><b>Day 365 · '+esc(F.title)+'</b><span>'+dateOf(d)+'</span></div><div class="pko" style="margin-bottom:2mm">'+esc(F.intro)+'</div>'
         + F.qs.map((Q,i) => '<div class="pq"><b>'+(i+1)+'.</b> <span class="ja">'+esc(Q.q)+'</span> <span class="pko">('+esc(Q.ko)+')</span></div><div class="pwrite"></div>').join('') + '</div>';
      h += '<div class="pday pb"><div class="ph"><b>졸업 인터뷰 모범답</b><span>내 답과 비교해 보세요</span></div>'
         + F.qs.map((Q,i) => '<div class="pq"><b>'+(i+1)+'.</b> <span class="ja">'+esc(Q.a)+'</span><div class="pko">'+esc(Q.ak)+'</div></div>').join('') + '</div>';
      continue;
    }
    if (isRev(d) || isTest(d)){
      const test = isTest(d), ds = rangeDays(test ? d-29 : d-6, d-1);
      const ws = [], ls = []; ds.forEach(X => { X.words.forEach(w => ws.push(w)); X.lines.concat(X.grammar.ex).forEach(l => ls.push(l)); });
      const pick = (arr, n) => arr.filter((_, i) => i % Math.max(1, Math.floor(arr.length / n)) === 0).slice(0, n);
      const pw = pick(ws, test ? 20 : 12), pl = pick(ls, test ? 10 : 4);
      revAns.push({d, pw, pl});
      h += '<div class="pday'+(test ? ' pb' : '')+'"><div class="ph"><b>Day '+d+' · '+(test ? (d/30)+'개월차 승급 시험' : '주간 복습')+'</b><span>'+dateOf(d)+'</span></div>';
      if (!test) h += '<div class="pg">'+ds.map(X => '<div><span class="pt">'+esc(X.grammar.point)+'</span> — <span class="ja">'+esc(X.grammar.ex[0].ja)+'</span> ('+esc(X.grammar.ex[0].ko)+')</div>').join('')+'</div>';
      h += '<div class="pq"><b>① 단어 뜻 쓰기</b></div><div class="pwords">'+pw.map(w => '<div><b>'+esc(w.w)+'</b> '+esc(w.r !== w.w ? w.r : '')+'<br>뜻: ________</div>').join('')+'</div>';
      h += '<div class="pq"><b>② 일본어로 말하고 써 보기</b></div>'+pl.map((l,i) => '<div class="pq">'+(i+1)+'. '+esc(l.ko)+'</div><div class="pwrite"></div>').join('');
      h += '<div class="pchk">☐ 앱 '+(test ? '20문제 테스트 + Day 1 녹음 비교' : '복습 퀴즈 10문제 + 대사 몰아서 섀도잉')+' &nbsp; 점수: ____ / '+(test?20:10)+'</div></div>';
      continue;
    }
    if (!D) continue;
    h += '<div class="pday"><div class="ph"><b>Day '+d+' · '+esc(D.title)+'</b><span>'+dateOf(d)+' · '+epLabel(D.ep)+' '+esc(D.epTitle)+'</span></div>';
    h += '<div class="pko" style="margin-bottom:2mm">'+esc(D.scene)+'</div>';
    D.lines.forEach(L => { h += '<div class="pl"><span class="pjp">'+esc(L.ja)+'</span> <span class="pko">— '+esc(L.who)+'</span><div class="pkana">'+esc(L.kana)+'</div><div class="pko">'+esc(L.ko)+'</div></div>'; });
    h += '<div class="pwords">'+D.words.map(w => '<div><b>'+esc(w.w)+'</b> '+esc(w.r !== w.w ? w.r : '')+'<br>'+esc(w.ko)+'</div>').join('')+'</div>';
    h += '<div class="pg"><span class="pt">'+esc(D.grammar.point)+'</span> — '+esc(D.grammar.desc)+'<br>'+D.grammar.ex.map(x => '<span class="ja">'+esc(x.ja)+'</span> ('+esc(x.ko)+')').join(' / ')+'</div>';
    h += '<div class="pq"><b>말투 변환</b> <span class="ja">'+esc(D.convert.anime)+'</span> → <span class="ja">'+esc(D.convert.real)+'</span></div>';
    h += '<div class="pq"><b>미션</b> '+esc(D.mission)+'</div><div class="pwrite"></div>';
    h += D.quiz.map((Q,i) => '<div class="pq">Q'+(i+1)+'. '+esc(Q.q)+' &nbsp; '+Q.choices.map((c,j) => '①②③'[j]+' <span class="ja">'+esc(c)+'</span>').join(' &nbsp; ')+'</div>').join('');
    h += '<div class="pchk">☐ 섀도잉 3회 &nbsp; ☐ 단어 8개 &nbsp; ☐ 미션 녹음 &nbsp; ☐ 퀴즈</div></div>';
  }
  h += '<div class="pday pb"><div class="ph"><b>정답</b><span>'+m+'개월차</span></div><div class="pans">'+rangeDays(a,b).map(D => '<div>Day '+D.day+': '+D.quiz.map(Q => '①②③'[Q.a]).join(' ')+'</div>').join('')+'</div>'+revAns.map(R => '<div class="pq"><b>Day '+R.d+'</b> ① '+R.pw.map(w => esc(w.w)+'='+esc(w.ko)).join(', ')+'<br>② '+R.pl.map((l,i) => (i+1)+'. <span class="ja">'+esc(l.ja)+'</span>').join(' ')+'</div>').join('')+'</div>';
  document.getElementById('print').innerHTML = h;
}

/* ================= 라우터 ================= */
function route(){
  try{ speechSynthesis.cancel(); }catch(e){}
  const h = location.hash.replace(/^#\/?/, '');
  const [v, a] = h.split('/');
  if (v === 'day' && a && hasContent(+a)) viewDay(+a);
  else if (v === 'review') viewReview();
  else if (v === 'words') viewWords();
  else if (v === 'print'){ viewPrint(+a || 1); viewHome(); setTimeout(() => { try{ if (!/headless/i.test(navigator.userAgent)) window.print(); }catch(e){} }, 800); }
  else viewHome();
}
addEventListener('hashchange', route);
route();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
